# Build the Android APK on GitHub's runners: no local gradle, no local NDK, no
# local 60 GB build tree on the machine that asks for the APK.
#
# Two jobs. `deps` cross-compiles the ~56 third-party libraries (hours) and
# caches the prefix; `apk` restores it, builds the host code generators and
# libblender.so, packages the payload and uploads the signed APK as an artifact.
# Splitting them keeps the hours of dependency work reusable: a rerun of `apk`
# alone starts from the cached prefix instead of paying for both halves again,
# and each half stays inside the 6-hour job limit.
#
# The dependency cache is keyed by the recipe version, not by the run: an
# unchanged recipe set restores what any earlier run built, and
# `deps/build.sh all` skips every library whose install directory already has
# content, so a warm deps job is minutes rather than hours. A prefix fallback
# (`restore-keys`) also picks up caches written under older keys.
#
# Triggers: a push to main, or Run workflow from the Actions tab (config: full
# or lite). The artifact is the same debug-signed development APK the local
# build produces -- installable as-is.
#
# The runner images ship their own Android SDK/NDK and export ANDROID_HOME,
# ANDROID_NDK_ROOT and ANDROID_NDK_VERSION pointing at it. env.sh reads those
# first, so without the overrides below the build would silently cross-compile
# against the image's NDK 27 instead of the pinned 28.2 (or against a deleted
# directory, since this workflow frees disk by removing the image's SDK).

name: Android APK

on:
  workflow_dispatch:
    inputs:
      config:
        description: "Build configuration"
        required: true
        default: full
        type: choice
        options:
          - full
          - lite
  push:
    branches:
      - main

concurrency:
  # A newer push supersedes the running build; the queued one starts fresh.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Shared by both jobs: build.py and deps/build.sh resolve BUILD_BASE from the
  # environment, and the cache path has to agree with it.
  BUILD_BASE: /home/runner/work/blender_build_android
  CONFIG: ${{ inputs.config || 'full' }}
  # Bump the suffix when the dependency recipes or their versions change: the
  # prefix fallback below then picks up the older prefix while the new one is
  # built, instead of silently restoring stale libraries.
  DEPS_CACHE_KEY: v1
  # Own the Android toolchain locations, so the image's exported Android
  # variables cannot redirect the build.
  ANDROID_HOME: /home/runner/android-sdk
  ANDROID_NDK_VERSION: 28.2.13676358
  ANDROID_NDK_ROOT: /home/runner/android-sdk/ndk/28.2.13676358
  JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

jobs:
  deps:
    name: Dependencies (${{ inputs.config || 'full' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Free disk space
        run: |
          # The images ship large SDK/runtime dirs this build never uses. The
          # image's own Android SDK goes too: this workflow installs the pinned
          # NDK under $ANDROID_HOME (see the overrides above) instead.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Install host toolchain
        run: |
          # Every apt/PPA step is retried: the archive and Launchpad mirrors
          # have both been observed to fail mid-read on the runners, and there
          # is no reason to lose a 50-minute build to that.
          for attempt in 1 2 3; do
            sudo apt-get update && break
            echo "[ci] apt-get update failed (attempt $attempt), retrying"
            sleep 15
          done
          for attempt in 1 2 3; do
            sudo apt-get install -y --no-install-recommends \
              build-essential gcc g++ patchelf meson cmake ninja-build git-lfs \
              curl wget xz-utils zip unzip yasm nasm \
              autoconf automake libtool pkg-config flex bison texinfo \
              openjdk-17-jdk-headless && break
            echo "[ci] apt-get install toolchain failed (attempt $attempt), retrying"
            sleep 15
          done
          # Host code generators want GCC 14+ or Clang 17+ (env.sh picks the
          # first it finds, gcc-15 > gcc-14 > clang-18 > clang-17).
          if ! command -v gcc-14 && ! command -v gcc-15 && \
             ! command -v clang-17 && ! command -v clang-18; then
            for attempt in 1 2 3; do
              sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test && break
              echo "[ci] add-apt-repository failed (attempt $attempt), retrying"
              sleep 15
            done
            for attempt in 1 2 3; do
              sudo apt-get update && break
              sleep 15
            done
            sudo apt-get install -y gcc-14 g++-14 || sudo apt-get install -y clang-17 || true
          fi
          (gcc-14 --version || gcc --version) | head -1
          cmake --version | head -1
          meson --version

      - name: Install host Python 3.13
        run: |
          # Ubuntu 24.04 ships 3.12. This is a convenience, not a requirement:
          # deps/build.sh stages its own 3.13 host interpreter when it builds the
          # `python` recipe, and `python` sits before every recipe that asks for
          # a host interpreter (numpy, certifi, pip, usd), so a warm-cache build
          # runs nothing and a cold one builds the interpreter itself. A dead
          # Launchpad (deadsnakes returns HTTP 500 GPGKeyTemporarilyNotFoundError
          # fairly often) must not fail a build that would otherwise succeed, so
          # every step here is best-effort and the last line never fails the job.
          if ! command -v python3.13; then
            for attempt in 1 2 3; do
              sudo add-apt-repository -y ppa:deadsnakes/ppa && break
              echo "[ci] add-apt-repository failed (attempt $attempt), retrying"
              sleep 15
            done || echo "[ci] could not add the deadsnakes PPA; continuing without it"
            for attempt in 1 2 3; do
              sudo apt-get update && break
              echo "[ci] apt-get update failed (attempt $attempt), retrying"
              sleep 15
            done || echo "[ci] apt-get update failed; continuing"
            for attempt in 1 2 3; do
              sudo apt-get install -y python3.13 python3.13-dev && break
              echo "[ci] apt-get install python3.13 failed (attempt $attempt), retrying"
              sleep 15
            done || echo "[ci] python3.13 not installed; the dependency build stages its own"
          fi
          if command -v python3.13; then
            python3.13 --version
          else
            echo "[ci] no system python3.13; deps/build.sh will build one when it needs it"
          fi

      - name: Fetch lib/linux_x64 (host libraries for the code generators)
        run: |
          # .gitmodules names this submodule, but the GitHub mirror never
          # recorded the gitlink, so `git submodule update` finds no pathspec:
          # clone the branch it names (the tip of blender-v5.3-release) straight
          # from Gitea. The libraries are LFS objects, served publicly; the
          # credential helper keeps an unattended LFS prompt from hanging.
          git config --global credential.helper '!f() { echo username=; echo password=; }; f'
          git clone --depth 1 -b blender-v5.3-release \
            https://projects.blender.org/blender/lib-linux_x64.git lib/linux_x64
          git -C lib/linux_x64 lfs pull || echo "[ci] no LFS objects in lib/linux_x64 (fine)"
          du -sh lib/linux_x64

      - name: Install the Android SDK and NDK
        run: |
          set -eux
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
            "platform-tools" "platforms;android-35" "build-tools;35.0.1" \
            "ndk;${ANDROID_NDK_VERSION}"
          ls "$ANDROID_HOME/ndk"

      - name: Restore the dependency prefix cache
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          key: blender-android-deps-${{ env.DEPS_CACHE_KEY }}
          restore-keys: |
            blender-android-deps-
          path: |
            /home/runner/work/blender_build_android/lib
          enableCrossOsArchive: true
          fail-on-cache-miss: false

      - name: Cross-compile dependencies
        run: |
          # build.sh all skips every library whose install directory already has
          # content, so a restored cache turns this into a no-op pass.
          bash build_files/android/deps/build.sh all
          du -sh "$BUILD_BASE/lib/android_arm64"

      - name: Cache the dependency prefix
        # Only when the exact key was not already there: re-saving a warm prefix
        # would double the repo's 10 GB cache budget for nothing.
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          # Content-addressed: any later run with the same recipes and versions
          # restores this instead of rebuilding from nothing.
          key: blender-android-deps-${{ env.DEPS_CACHE_KEY }}
          path: |
            /home/runner/work/blender_build_android/lib
          enableCrossOsArchive: true

  apk:
    name: Blender + APK (${{ inputs.config || 'full' }})
    runs-on: ubuntu-24.04
    needs: deps
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Install host toolchain
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update && break
            echo "[ci] apt-get update failed (attempt $attempt), retrying"
            sleep 15
          done
          for attempt in 1 2 3; do
            sudo apt-get install -y --no-install-recommends \
              build-essential gcc g++ patchelf meson cmake ninja-build git-lfs \
              curl wget xz-utils zip unzip yasm nasm \
              autoconf automake libtool pkg-config flex bison texinfo \
              openjdk-17-jdk-headless && break
            echo "[ci] apt-get install toolchain failed (attempt $attempt), retrying"
            sleep 15
          done
          # Host code generators want GCC 14+ or Clang 17+ (env.sh picks the
          # first it finds, gcc-15 > gcc-14 > clang-18 > clang-17).
          if ! command -v gcc-14 && ! command -v gcc-15 && \
             ! command -v clang-17 && ! command -v clang-18; then
            for attempt in 1 2 3; do
              sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test && break
              echo "[ci] add-apt-repository failed (attempt $attempt), retrying"
              sleep 15
            done
            for attempt in 1 2 3; do
              sudo apt-get update && break
              sleep 15
            done
            sudo apt-get install -y gcc-14 g++-14 || sudo apt-get install -y clang-17 || true
          fi
          (gcc-14 --version || gcc --version) | head -1
          # env.sh's default JAVA_HOME on Linux; verify it is where apt put it.
          ls -d "$JAVA_HOME"

      - name: Install host Python 3.13
        run: |
          if ! command -v python3.13; then
            sudo add-apt-repository -y ppa:deadsnakes/ppa
            sudo apt-get update
            sudo apt-get install -y python3.13 python3.13-dev
          fi
          python3.13 --version

      - name: Fetch lib/linux_x64 (host libraries for the code generators)
        run: |
          # Same direct clone as the deps job: .gitmodules names the submodule
          # but the GitHub mirror never recorded the gitlink, so `git submodule
          # update` finds no pathspec. Gitea serves the LFS libraries publicly;
          # the credential helper keeps an unattended LFS prompt from hanging.
          git config --global credential.helper '!f() { echo username=; echo password=; }; f'
          git clone --depth 1 -b blender-v5.3-release \
            https://projects.blender.org/blender/lib-linux_x64.git lib/linux_x64
          git -C lib/linux_x64 lfs pull || echo "[ci] no LFS objects in lib/linux_x64 (fine)"
          du -sh lib/linux_x64

      - name: Restore the dependency prefix
        uses: actions/cache/restore@v4
        with:
          key: blender-android-deps-${{ env.DEPS_CACHE_KEY }}
          restore-keys: |
            blender-android-deps-
          path: |
            /home/runner/work/blender_build_android/lib
          enableCrossOsArchive: true
          fail-on-cache-miss: false

      - name: Build the dependency prefix if the cache missed
        run: |
          # hashFiles() cannot see outside the workspace, so test the prefix
          # itself: an empty or absent directory means the restore found nothing.
          if [ -z "$(ls -A "$BUILD_BASE/lib/android_arm64" 2>/dev/null)" ]; then
            echo "[ci] no cached prefix; building dependencies here (this is the slow path)"
            bash build_files/android/deps/build.sh all
          else
            echo "[ci] cached dependency prefix restored"
          fi

      - name: Install the Android SDK and NDK
        run: |
          set -eux
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
            "platform-tools" "platforms;android-35" "build-tools;35.0.1" \
            "ndk;${ANDROID_NDK_VERSION}"
          ls "$ANDROID_HOME/ndk"

      - name: Build Blender and package the APK
        run: |
          # --repackage is required for any change under scripts/ or
          # release/datafiles (the MCP add-on lives there); it also builds the
          # config-matched host code generators, which a version or DNA change
          # would otherwise leave stale.
          python3 build_files/android/build.py "$CONFIG" --repackage
          APK="$(ls "$BUILD_BASE"/android_apk_stage_"$CONFIG"/blender-"$CONFIG".apk)"
          ls -lh "$APK"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: blender-${{ env.CONFIG }}-apk
          path: /home/runner/work/blender_build_android/android_apk_stage_${{ env.CONFIG }}/blender-${{ env.CONFIG }}.apk
          if-no-files-found: error
          retention-days: 14
